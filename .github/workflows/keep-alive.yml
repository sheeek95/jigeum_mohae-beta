name: Keep Backend Warm

# Render's free tier spins the backend down after inactivity, so the first
# request after a while sleeping can take 30-60+ seconds (the app's initial
# load, and the invite-code screen, both hit this). Pinging /health on a
# schedule keeps the instance warm so real requests stay fast.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf -o /dev/null -w '%{http_code} %{time_total}s\n' https://jigeum-mohae-api.onrender.com/health
