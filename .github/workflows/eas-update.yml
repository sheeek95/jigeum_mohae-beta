name: EAS Update

# Pushes an OTA JS update to the "preview" channel whenever app code changes
# on this branch — installed builds (from the "preview" EAS Build profile)
# pick it up automatically on next launch, no reinstall needed. Native-level
# changes (new native modules, app icon, permissions, the widget extension)
# still require a fresh EAS Build.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/ios-android-cross-platform-app-bbzq4r
    paths:
      - '.github/workflows/eas-update.yml'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish OTA update
        # The commit message is passed through an env var rather than interpolated
        # straight into the run: string — a message containing a literal " or `
        # (both appear in normal commit messages here) would otherwise break out
        # of the shell quoting and get re-parsed as extra eas-cli arguments.
        #
        # `eas update` does NOT read eas.json's build.*.env (that's build-only),
        # so without these set here explicitly, every OTA publish re-bundles JS
        # with EXPO_PUBLIC_USE_RN_FETCH unset — silently reverting to SDK 57's
        # own fetch/FormData and reintroducing the "Unsupported FormDataPart
        # implementation" photo-upload crash on the very next app/** push, even
        # though eas-build.yml's builds have had the fix since Aug 29. Keep
        # this in sync with eas.json's build.preview/production.env.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPO_PUBLIC_API_URL: https://jigeum-mohae-api.onrender.com
          EXPO_PUBLIC_USE_RN_FETCH: '1'
        run: eas update --channel preview --message "$COMMIT_MESSAGE" --non-interactive
